<!DOCTYPE html>
<html>

<head>
    <title>Registration Form</title>

    <!-- ADD JAVASCRIPT HERE -->
    <script>

        function validateform() {

            var name = document.getElementById("firstname").value;
            var password = document.getElementById("password").value;

            // Name Validation
            if (!/^[a-zA-Z]{6,}$/.test(name)) {
                alert("Name should contain only alphabets and minimum 6 characters.");
                return false;
            }

            // Password Validation
            if (password.length < 6) {
                alert("Password should contain minimum 6 characters.");
                return false;
            }

            alert("Registration Successful!");
            return true;
        }

    </script>

</head>

<body bgcolor="grey">

    <center>
        <font color="" size="6" face="Arial">
            Registration Form
        </font>
    </center>

    <br>

    <!-- IMPORTANT: add onsubmit here -->
    <form onsubmit="return validateform();">

        First Name
        <font color="red">*</font>
        <input type="text" id="firstname">

        <br><br>

        Last Name
        <font color="red">*</font>
        <input type="text" id="lastname">

        <br><br>

        Email Address
        <font color="red">*</font>
        <input type="text" id="email">

        <br><br>

        Password (minimum 6 characters)
        <font color="red">*</font>
        <input type="password" id="password">

        <br><br>

        Address
        <font color="red">*</font>
        <textarea rows="2" cols="20" id="addr"></textarea>

        <br><br>

        Mobile No
        <font color="red">*</font>
        <input type="text" id="mobileno">

        <br><br>

        Gender:
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female

        <br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

    </form>

</body>
</html>
