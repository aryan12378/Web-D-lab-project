<!DOCTYPE html>
<html>
<head>
    <title>Shopping Cart</title>
</head>

<body>

    <h2 align="center">Shopping Cart</h2>

    <table border="1" cellpadding="10" cellspacing="0" width="90%" align="center">

        <tr align="center">
            <th>Book Name</th>
            <th>Author Name</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Total Amount</th>
            <th>Action</th>
        </tr>

        <tr align="center">
            <td>Computer Science</td>
            <td>Robert Sedgewick</td>
            <td>Rs. 4000</td>
            <td>
                <input type="number" value="1" min="1">
            </td>
            <td>Rs. 4000</td>
            <td>
                <button>Remove</button>
            </td>
        </tr>

        <tr align="center">
            <td>Operating System Concepts</td>
            <td>Dr. Ikvinderpal Singh</td>
            <td>Rs. 3800</td>
            <td>
                <input type="number" value="1" min="1">
            </td>
            <td>Rs. 3800</td>
            <td>
                <button>Remove</button>
            </td>
        </tr>

        <tr align="center">
            <td>Database System Concepts</td>
            <td>Abraham Silberschatz</td>
            <td>Rs. 2500</td>
            <td>
                <input type="number" value="1" min="1">
            </td>
            <td>Rs. 2500</td>
            <td>
                <button>Remove</button>
            </td>
        </tr>

        <tr align="right">
            <td colspan="4">
                <b>Grand Total</b>
            </td>
            <td align="center">
                <b>Rs. 10300</b>
            </td>
            <td></td>
        </tr>

    </table>

    <br>

    <table width="90%" align="center">
        <tr>
            <td align="left">
                <button>Continue Shopping</button>
            </td>

            <td align="right">
                <button>Proceed to Purchase</button>
            </td>
        </tr>
    </table>

</body>
</html>
